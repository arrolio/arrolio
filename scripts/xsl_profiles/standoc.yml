# Standoc vocabulary profile for scripts/xsl_to_config.rb.
#
# Provides everything the converter CANNOT derive from the XSL itself:
# the Metanorma standoc element vocabulary (clause, p, fmt-title, ...),
# the default font family for inline variants (Times New Roman),
# the cover-page boilerplate (organisation strings), and the
# header/footer text template.
#
# This file is the only place standoc-specific constants live. The
# converter is fully generic; running it with a different profile
# produces YAML for a different vocabulary family.

element_mapping:
  clause: { content_type: section }
  terms: { content_type: section }
  definitions: { content_type: section }
  annex2: { content_type: section }
  p: { content_type: paragraph }
  table: { content_type: table }
  figure: { content_type: figure }
  ul: { content_type: list, kind: bullet }
  ol: { content_type: list, kind: ordered }
  dl: { content_type: list, kind: bullet }
  term: { content_type: term }
  note: { content_type: note }
  termnote: { content_type: note }
  example: { content_type: note }
  pre: { content_type: preformatted }
  sourcecode: { content_type: preformatted }
  pagebreak: { content_type: pagebreak }

inline_styles:
  strong: strong
  em: em
  tt: monospace
  sub: subscript
  sup: superscript
  link: link
  xref: xref
  fmt-xref: xref
  eref: xref
  fmt-identifier: identifier
  identifier: identifier
  fmt-preferred: term
  preferred: term
  fmt-name: term
  renderterm: term
  refterm: term
  term: term

span_class_styles:
  boldtitle: strong
  bold: strong
  fmt-caption-label: caption_label
  fmt-element-name: caption_label
  citetbl: xref
  citetable: xref
  citesection: xref

paragraph_styles:
  zzSTDTitle1: doc_title

block_level_elements:
  - note
  - termnote
  - example
  - figure
  - table
  - clause
  - ul
  - ol
  - dl
  - formula
  - fmt-xref-label
  - fmt-fn-body
  - fmt-footnote-container

skip_metadata_elements:
  - asciimath
  - latexmath
  - image
  - localityStack
  - locality
  - referenceFrom
  - referenceTo
  - origin
  - source

skip_elements:
  - title
  - fmt-title
  - fmt-xref-label
  - fmt-name
  - fmt-fn-body
  - fmt-footnote-container

tab_replacements:
  biblio-tag: " "

selectors:
  heading: fmt-title
  heading_depth_attribute: depth
  list_item: li
  list_item_label: fmt-name
  paragraph: p
  term_number: fmt-name
  term_preferred: fmt-preferred
  term_definition: fmt-definition
  term_source: fmt-termsource
  note_label: fmt-name
  figure_image: image
  figure_caption: fmt-name
  figure_caption_fallback: name
  table_row: tr
  table_cell:
    - td
    - th
  table_header: thead
  table_body: tbody
  biblio_tag: biblio-tag
  biblio_formattedref: formattedref
  image_src_attribute: src
  image_alt_attribute: alt
  id_attribute: id
  autonum_class: fmt-autonum-delim
  stem: stem
  stem_formatted: fmt-stem
  math: math
  footnote_container: fmt-footnote-container
  footnote_body: fmt-fn-body
  footnote_marker: fn
  preface_container: preface
  preface_children:
    - clause
    - foreword
  bibliography_container: bibliography
  bibliography_reference: references
  bibliography_item: bibitem
  fallback_title: title
  span: span
  tab_inline: tab
  break_inline: br

metadata_fields:
  docidentifier: "docidentifier[@primary='true']"
  docnumber: docnumber
  edition: edition
  revision_date: version
  title: "title[@type='main']"
  title_intro: "title[@type='title-intro']"
  title_main: "title[@type='title-main']"
  title_part: "title[@type='title-part']"
  title_complementary: "title[@type='title-complementary']"
  title_part_prefix: "title[@type='title-part-prefix']"
  doctype: doctype
  language: language

cover_fields:
  - docidentifier
  - edition
  - title_intro
  - title_main
  - title_complementary
  - title_part

style_overrides:
  body_margin_bottom: 0
  strong_font_name: "Times New Roman Bold"
  em_font_name: "Times New Roman Italic"
  identifier_font_name: "Times New Roman Italic"
  term_font_name: "Times New Roman Italic"
  link_font_name: "Times New Roman Italic"
  table_header_cell_font_name: "Times New Roman Bold"
  cover_docidentifier_font_name: "Jost SemiBold"
  cover_title_font_name: "Jost"
  cover_title_other_font_name: "Jost Light"
  cover_org_font_name: "Jost"
  cover_label_font_name: "Jost"
  list_marker_font_name: "Times New Roman Bold"

cover_content:
  - type: spacer
    size: 30
  - type: text
    source: "{{docidentifier}}"
    style: cover_docidentifier
  - type: spacer
    size: 20
  - type: text
    source: "{{title_intro}}"
    style: cover_title_other
    when: title_intro_present
  - type: text
    source: "{{title_main}}"
    style: cover_title
  - type: text
    source: "{{title_part}}"
    style: cover_title_part
    when: title_part_present
  - type: text
    source: "{{title_complementary}}"
    style: cover_title_other
    when: title_complementary_present
  - type: spacer
    size: 30
  - type: text
    source: "Organisation Internationale de Métrologie Légale"
    style: cover_org
  - type: text
    source: "International Organization of Legal Metrology"
    style: cover_org
  - type: spacer
    size: 20
  - type: text
    source: "{{docidentifier}} {{edition}}"
    style: cover_label

header_template: "{{docidentifier}}: {{revision_date}}"
