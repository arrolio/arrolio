# Synthetic sample flavor flow rules for specs.

page_sequences:
  - role: cover
    header: null
    footer: null
    build_content: cover_content
  - role: preface
    header: "{{docidentifier}}"
    footer: "%d"
    header_align: right
  - role: body
    header: "{{docidentifier}}"
    footer: "%d"
    header_align: right
  - role: bibliography
    header: "{{docidentifier}}"
    footer: "%d"
    header_align: right

cover_content:
  - type: spacer
    size: 30
  - type: text
    source: "{{docidentifier}}"
    style: cover_docidentifier
  - type: spacer
    size: 20
  - type: text
    source: "Sample document"
    style: cover_label
  - type: spacer
    size: 30
  - type: text
    source: "{{title_main}}"
    style: cover_title
  - type: text
    source: "Part 1: {{title_part}}"
    style: cover_title_part
    when: title_part_present
  - type: spacer
    size: 30
  - type: text
    source: "Sample Organization"
    style: cover_org

section:
  heading_style: "{{title_style_id}}"
  body_style: "{{style_id}}"
  insert_page_break_before: true
  insert_page_break_after_section: true

content_to_flowable:
  Paragraph: text_paragraph
  Table: table
  List: list
  Image: image
  Preformatted: preformatted
  PageBreak: page_break

style_resolution:
  paragraph: resolve_from_style_id
  heading: resolve_from_title_style_id
  table_cell: resolve_from_table_cell_style
  list_item: resolve_from_list_style

toc:
  styles:
    entry: toc_entry
    sub: toc_entry_sub
